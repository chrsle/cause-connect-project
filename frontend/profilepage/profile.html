<!DOCTYPE html>
<html>
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Profile Page</title>

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap" 
        rel="stylesheet">
       
        <link rel="stylesheet" href="profileStyles.css">
    </head>
    <body style="background-color: rgb(25, 131, 248);">
        <h1>Create Student Profile</h1>
        <div class="menu">
            <div>
                <h2> Full Name</h2>
            </div>
            <div>
                <input type="text" class="inputBox" placeholder="Enter full name">
            </div>
            <div>
                <h2> Age </h2>
            </div>
            <div>
                <input type="text" class="inputBox" placeholder="Enter age">
            </div>

            <div >
                <h2> School </h2>
            </div>
            <div>
                <input type="text" class="inputBox" placeholder="Enter school name">
            </div>
        </div>
        
        <div class="personalBioGrid">
            <div>
                <h2> Personal Bio </h2>
            </div>
            <div>
                <label for="PersonalBio"></label>
                <textarea id="PersonalBio" name="PersonalBio" rows="50" cols="50">Write a short bio to share a little about yourself. You can include your hobbies, goals, or why you're passionate about volunteering. (e.g, 'Hi, I'm Alex! I love helping animals and aspire to become a veterinarian.')</textarea>
            </div>
        </div>

        <div class="button">
            <a href="../interestpage/interests.html" class="button">
                Next Page
             </a>
        </div>
    </body>
</html>
